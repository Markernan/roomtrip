# CI de la app Android: compila y corre lint en una máquina limpia de GitHub.
# Si aquí falla, no importa que "en mi compu funcione": el PR no se debe mergear.
name: Android CI

on:
  pull_request:
  push:
    branches: [main, buena-integracion, Edusitos-version]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      # JDK 21: el lint de AGP 8.7.3 no corre sobre JDK 25.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # Cachea Gradle y dependencias entre ejecuciones.
      - uses: gradle/actions/setup-gradle@v6

      - name: Compilar (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Lint (falla si hay errores; las advertencias no bloquean)
        run: ./gradlew lintDebug

      - name: Subir reporte de lint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-lint
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

      - name: Subir APK de debug
        uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
