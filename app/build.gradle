plugins {
    alias(libs.plugins.android.application)
    // Necesita app/google-services.json (no se versiona: ver docs/manual-instalacion.md, sección 5)
    alias(libs.plugins.google.services)
}

// Claves del Lab 7 que se leen de local.properties, que no se versiona:
//   MAPS_API_KEY        clave de Google Maps. Sin ella el mapa sale en gris.
//   TAXI_API_URL        URL del gateway de la API de taxistas (por defecto, la desplegada en Cloud Run).
//   TAXI_API_CORREO     correo de la credencial de servicio APP_MOVIL de la API.
//   TAXI_API_PASSWORD   su contrasena (solo letras y numeros: va dentro de un texto de Java). La pasa por
//                       privado quien administra la nube; sin ella la app funciona, pero avisa que la
//                       conexion con el servicio de taxistas no esta configurada.
// Sin clave la app compila y funciona, pero el mapa sale en gris.
def propiedadesLocales = new Properties()
def archivoLocal = rootProject.file('local.properties')
if (archivoLocal.exists()) archivoLocal.withInputStream { propiedadesLocales.load(it) }

android {
    namespace 'com.example.roomtrip'
    compileSdk 35

    buildFeatures {
        viewBinding true
        buildConfig true   // BuildConfig.TAXI_API_* (ver data/api/TaxiServicios)
    }

    defaultConfig {
        applicationId "com.example.roomtrip"
        minSdk 34
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        manifestPlaceholders = [MAPS_API_KEY: propiedadesLocales.getProperty('MAPS_API_KEY', '')]

        buildConfigField "String", "TAXI_API_URL",
                "\"${propiedadesLocales.getProperty('TAXI_API_URL', 'https://gateway-service-7oe536zvqa-uc.a.run.app')}\""
        buildConfigField "String", "TAXI_API_CORREO",
                "\"${propiedadesLocales.getProperty('TAXI_API_CORREO', '')}\""
        buildConfigField "String", "TAXI_API_PASSWORD",
                "\"${propiedadesLocales.getProperty('TAXI_API_PASSWORD', '')}\""
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.material
    implementation libs.navigation.fragment.ktx
    implementation libs.navigation.ui.ktx
    implementation 'com.google.zxing:core:3.5.3'
    // Lab 7: el taxista lee el QR del cliente con la cámara (RN-011)
    implementation libs.zxing.android.embedded
    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
    implementation libs.glide
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // Firebase (Lab 6). El BoM fija versiones compatibles entre sí: auth y firestore van sin versión
    implementation platform(libs.firebase.bom)
    implementation libs.firebase.auth
    implementation libs.firebase.firestore
    // FirebaseUI: pantallas de login con correo y Google ya hechas (Clase 10)
    implementation libs.firebase.ui.auth

    // Lab 7: mapa (Google Maps SDK) y ubicación periódica del taxista (Fused Location Provider)
    implementation libs.play.services.maps
    implementation libs.play.services.location

    // Lab 7: API REST de taxistas (gateway en Cloud Run). Ver docs/integracion-api-taxistas.md
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    implementation libs.okhttp
    testImplementation libs.okhttp.mockwebserver
}